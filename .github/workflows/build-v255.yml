name: Build V2.55 Full Member Performance

on:
  push:
    paths:
      - '.github/workflows/build-v255.yml'
      - 'scripts/build-v254.py'
      - 'scripts/build-v255.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build V2.55
        run: python scripts/build-v255.py

      - name: Commit V2.55
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v2.55.html index.html \
            opportunity-types-fast-v2.55.js \
            regions-archive-fast-v2.55.js \
            events-newbadges-fast-v2.55.js \
            events-stability-fast-v2.55.js
          git diff --cached --quiet && exit 0
          git commit -m "Generate V2.55 full member performance release"
          git push
