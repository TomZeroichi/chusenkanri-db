name: Build V2.35 swipe archive

on:
  push:
    paths:
      - '.github/workflows/build-v235.yml'
      - 'swipe-archive-v2.35.js'
      - 'preview-v2.34.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate V2.35
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src=Path('preview-v2.34.html')
          if not src.exists():
              raise SystemExit('preview-v2.34.html not found')

          html=src.read_text(encoding='utf-8')
          html=html.replace('V2.34','V2.35')
          tag='\n<script src="./swipe-archive-v2.35.js?v=2.35.1"></script>\n'
          if 'swipe-archive-v2.35.js' not in html:
              html=html.replace('</body>',tag+'</body>',1)
          Path('preview-v2.35.html').write_text(html,encoding='utf-8')

          index='''<!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./preview-v2.35.html?v=2351"><title>TOM 抽選マネージャー</title><script>location.replace('./preview-v2.35.html?v=2351');</script></head><body><p><a href="./preview-v2.35.html?v=2351">TOM 抽選マネージャー V2.35 を開く</a></p></body></html>
          '''
          Path('index.html').write_text(index,encoding='utf-8')
          PY

      - name: Commit generated V2.35
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v2.35.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Generate V2.35 swipe archive release"
          git push
