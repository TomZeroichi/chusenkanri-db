name: Build V2.47 Entry Deadline Fix

on:
  push:
    paths:
      - '.github/workflows/build-v247.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build V2.47 from V2.46
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('preview-v2.46.html').read_text(encoding='utf-8')
          html = src.replace('V2.46', 'V2.47')
          patch = '\n<script src="./entry-deadline-fix-v2.47.js?v=2.47.0"></script>\n'
          if 'entry-deadline-fix-v2.47.js' not in html:
              html = html.replace('</body>', patch + '</body>')
          Path('preview-v2.47.html').write_text(html, encoding='utf-8')

          index = '''<!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./preview-v2.47.html?v=2471"><title>TOM エントリーマネージャー</title><script>location.replace('./preview-v2.47.html?v=2471');</script></head><body><p><a href="./preview-v2.47.html?v=2471">TOM エントリーマネージャー V2.47 を開く</a></p></body></html>'''
          Path('index.html').write_text(index, encoding='utf-8')
          PY

      - name: Commit V2.47
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v2.47.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Generate V2.47 entry deadline fix"
          git push
