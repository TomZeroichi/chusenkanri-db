name: Build V2.53 Wrapped Category Tabs

on:
  push:
    paths:
      - '.github/workflows/build-v253.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build V2.53 from V2.52
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('preview-v2.52.html').read_text(encoding='utf-8')
          html = src.replace('V2.52', 'V2.53')
          patch = '\n<script src="./category-tabs-v2.53.js?v=2.53.0"></script>\n'
          if 'category-tabs-v2.53.js' not in html:
              html = html.replace('</body>', patch + '</body>')
          Path('preview-v2.53.html').write_text(html, encoding='utf-8')

          index = '''<!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./preview-v2.53.html?v=2531"><title>TOM エントリーマネージャー</title><script>location.replace('./preview-v2.53.html?v=2531');</script></head><body><p><a href="./preview-v2.53.html?v=2531">TOM エントリーマネージャー V2.53 を開く</a></p></body></html>'''
          Path('index.html').write_text(index, encoding='utf-8')
          PY

      - name: Commit V2.53
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v2.53.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Generate V2.53 wrapped category tabs"
          git push
