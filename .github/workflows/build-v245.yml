name: Build V2.45 UI stability

on:
  push:
    paths:
      - '.github/workflows/build-v245.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build V2.45 from V2.44
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('preview-v2.44.html').read_text(encoding='utf-8')
          html = src.replace('V2.44', 'V2.45')
          patch = '\n<script src="./ui-stability-v2.45.js?v=2.45.0"></script>\n<script src="./mail-status-v2.45.js?v=2.45.0"></script>\n'
          if 'ui-stability-v2.45.js' not in html:
              html = html.replace('</body>', patch + '</body>')
          Path('preview-v2.45.html').write_text(html, encoding='utf-8')

          index = '''<!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./preview-v2.45.html?v=2451"><title>TOM 応募・抽選マネージャー</title><script>location.replace('./preview-v2.45.html?v=2451');</script></head><body><p><a href="./preview-v2.45.html?v=2451">TOM 応募・抽選マネージャー V2.45 を開く</a></p></body></html>'''
          Path('index.html').write_text(index, encoding='utf-8')
          PY

      - name: Commit V2.45
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v2.45.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Generate V2.45 UI stability release"
          git push
