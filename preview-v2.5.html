<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOM 抽選マネージャー V2.5</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#202633;--muted:#7c8595;--line:#dce2eb;--blue:#3d83ef;--pokemon:#ffe600;--pokemon-soft:#fffec7;--onepiece:#d91f4e;--onepiece-soft:#ffe3ec;--dragonball:#ff9f1a;--dragonball-soft:#fff1bf;--other:#25a7ff;--other-soft:#e2f5ff;--danger:#ed4350}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:820px;margin:auto;padding:14px 12px 40px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:20px;margin:0}.top small{color:var(--muted)}.badge{border:1px solid var(--line);border-radius:999px;background:#fff;padding:6px 9px;font-size:11px;font-weight:900}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.tabs button,.filter,.sort,.soft,.primary{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px;font-weight:900}.tabs button.active,.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}.sum{border:1px solid var(--line);border-radius:11px;padding:7px 6px;min-width:0}.sum:nth-child(1){background:#eef6ff}.sum:nth-child(2){background:#fffec7}.sum:nth-child(3){background:#ffe8ef}.sum:nth-child(4){background:#fff1bf}.sum span{display:block;font-size:9px;line-height:1.1;color:var(--muted);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sum b{display:block;font-size:18px;line-height:1;margin-top:3px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px}.searchrow{display:grid;grid-template-columns:1fr 120px;gap:7px}.input,.select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.filter{border-radius:999px;padding:7px 10px;font-size:11px}.filter.active{background:#1f2734;color:#fff}.listhead{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px}.listhead h2{font-size:16px;margin:0}.sort{padding:8px 10px}.list{display:flex;flex-direction:column;gap:9px}.card{position:relative;border:2px solid var(--line);border-left:0;border-radius:16px;overflow:hidden;background:#fff}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--strip)}.card.pokemon{--strip:var(--pokemon);border-color:#f1da00;background:var(--pokemon-soft)}.card.onepiece{--strip:var(--onepiece);border-color:#ef9db2;background:var(--onepiece-soft)}.card.dragonball{--strip:var(--dragonball);border-color:#f6c06d;background:var(--dragonball-soft)}.card.other{--strip:var(--other);border-color:#87cef7;background:var(--other-soft)}.card.multi2:before{background:linear-gradient(to bottom,var(--m1) 0 50%,var(--m2) 50% 100%)}.card.multi3:before{background:linear-gradient(to bottom,var(--m1) 0 33.33%,var(--m2) 33.33% 66.66%,var(--m3) 66.66% 100%)}.summarybtn{width:100%;border:0;background:transparent;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;text-align:left;padding:11px 9px 11px 16px}.main{min-width:0}.meta{display:flex;align-items:center;gap:6px;min-width:0;margin-bottom:6px;flex-wrap:nowrap}.brands{display:inline-flex;gap:4px;flex-wrap:wrap}.brand{border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;white-space:nowrap}.brand.pokemon{background:var(--pokemon);color:#332b00}.brand.onepiece{background:var(--onepiece);color:#fff}.brand.dragonball{background:var(--dragonball);color:#fff}.brand.other{background:var(--other);color:#fff}.pending{width:28px;min-width:28px;max-width:28px;height:28px;min-height:28px;max-height:28px;flex:0 0 28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-size:12px;font-weight:900;line-height:1;padding:0}.store{color:var(--muted);font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.datebox{width:92px;border:2px solid rgba(0,0,0,.08);border-radius:13px;padding:6px;text-align:center;background:#fff}.datebox.urgent{background:var(--danger);color:#fff;border-color:var(--danger)}.datebox small{display:block;color:var(--muted);font-weight:900}.datebox.urgent small{color:#fff}.date{font-size:26px;line-height:1;font-weight:1000;margin:3px 0}.left{font-size:10px;font-weight:900;color:var(--danger)}.datebox.urgent .left{color:#fff}.detail{display:none;border-top:1px solid var(--line);padding:12px 12px 12px 16px;background:rgba(255,255,255,.65)}.card.open .detail{display:block}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.chip.app{background:#eef9f4;color:#18805a;border-color:#bfe6d4}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.links a{text-decoration:none;color:var(--text);border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;text-align:center;font-size:12px;font-weight:900}.links a.entry{background:var(--blue);border-color:var(--blue);color:#fff}.statusbox{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.statusbox label{font-size:11px;font-weight:900;color:var(--muted)}.statusbox select{margin-top:5px}.admin{display:none}.admin.show{display:block}.member.hide{display:none}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.panel h3{margin:0 0 4px}.panel p,.hint{color:var(--muted);font-size:12px;line-height:1.6}.choices{display:flex;flex-wrap:wrap;gap:6px}.choice{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#fff;font-size:11px;font-weight:900}.choice.on.pokemon{background:var(--pokemon)}.choice.on.onepiece{background:var(--onepiece);color:#fff}.choice.on.dragonball{background:var(--dragonball);color:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.field{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fafbfc}.field small{display:block;color:var(--muted);font-weight:900}.field b{display:block;margin-top:3px}.full{grid-column:1/-1}.note{margin-top:10px;padding:10px;border-radius:12px;background:#f5f9ff;color:#49658e;font-size:12px}@media(max-width:560px){.summary{gap:4px}.sum{padding:6px 5px}.sum span{font-size:8px}.sum b{font-size:16px}.searchrow{grid-template-columns:1fr}.links{grid-template-columns:1fr 1fr}.datebox{width:84px}.date{font-size:23px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head><body><main class="app"><div class="top"><div><h1>TOM 抽選マネージャー</h1><small>V2.5 共有プレビュー</small></div><span class="badge">DEMO</span></div><div class="tabs"><button id="memberTab" class="active">会員画面</button><button id="adminTab">運営画面</button></div>
<section id="memberView" class="member"><div class="summary"><div class="sum"><span>管理中</span><b>6</b></div><div class="sum"><span>未応募</span><b>5</b></div><div class="sum"><span>本日締切</span><b>1</b></div><div class="sum"><span>3日以内</span><b>3</b></div></div><div class="toolbar"><div class="searchrow"><input id="search" class="input" placeholder="店舗・商品を検索"><select class="select"><option>すべて</option><option>未応募</option><option>結果待ち</option></select></div><div class="filters"><button class="filter active" data-cat="all">すべて</button><button class="filter" data-cat="pokemon">POKÉMON</button><button class="filter" data-cat="onepiece">ONE PIECE</button><button class="filter" data-cat="dragonball">DRAGON BALL</button><button class="filter" data-cat="other">OTHER / TOY</button></div></div><div class="listhead"><h2>抽選一覧</h2><select class="sort"><option>締切が近い順</option></select></div><div class="list" id="list"></div></section>
<section id="adminView" class="admin"><div class="panel"><h3>運営画面：投稿文の解析例</h3><p>今回のように「アプリから応募」「店舗一覧」「詳細」だけがある抽選にも対応する想定です。</p><div class="formgrid"><div class="field"><small>店舗</small><b>お宝創庫グループアプリ</b></div><div class="field"><small>カテゴリ</small><b>POKÉMON</b></div><div class="field full"><small>タイトル</small><b>ストームエメラルダ / スターターセット3種</b></div><div class="field"><small>応募方法</small><b>アプリ</b></div><div class="field"><small>受取方法</small><b>店舗受取</b></div><div class="field"><small>会員条件</small><b>アプリ会員限定</b></div><div class="field"><small>締切</small><b>8/23 23:45</b></div><div class="field"><small>リンク</small><b>店舗一覧 / 詳細</b></div></div><div class="note">複数カテゴリは2色・3色の左縁で表示。会員ごとの応募ステータスは各個人で管理する設計です。</div></div></section></main>
<script>
const C={pokemon:'#ffe600',onepiece:'#d91f4e',dragonball:'#ff9f1a',other:'#25a7ff'},N={pokemon:'POKÉMON',onepiece:'ONE PIECE',dragonball:'DRAGON BALL',other:'OTHER / TOY'};
const data=[
{cats:['onepiece'],store:'Joshin',title:'ストームエメラルダ / 世界最強の戦士',date:'8/20',time:'17:59',left:'本日',status:'未応募',urgent:true,fulfill:'店舗受取',apply:'Web応募',member:'会員条件確認',links:['応募フォーム','詳細']},
{cats:['onepiece'],store:'ヤマシロヤ',title:'決戦の刻 / 神の島の冒険',date:'8/21',time:'21:30',left:'あと1日',status:'未応募',fulfill:'配送',apply:'Web応募',member:'会員登録必要',links:['会員登録','応募フォーム']},
{cats:['pokemon'],store:'お宝創庫グループアプリ',title:'ストームエメラルダ / スターターセット3種',date:'8/23',time:'23:45',left:'あと3日',status:'未応募',fulfill:'店舗受取',apply:'アプリ応募',member:'アプリ会員限定',links:['店舗一覧','詳細']},
{cats:['pokemon'],store:'三洋堂',title:'30th CELEBRATION / プレミアムデッキセット',date:'9/1',time:'',left:'あと12日',status:'未応募',fulfill:'店舗受取',apply:'Web応募',member:'会員登録必要',links:['店舗一覧','応募フォーム']},
{cats:['pokemon','onepiece'],store:'複合抽選サンプル',title:'ポケカ + ONE PIECE 同時抽選',date:'9/3',time:'20:00',left:'あと14日',status:'未応募',fulfill:'配送',apply:'Web応募',member:'会員条件確認',links:['詳細','応募フォーム']},
{cats:['pokemon','onepiece','dragonball'],store:'3カテゴリ抽選サンプル',title:'POKÉMON / ONE PIECE / DRAGON BALL',date:'9/5',time:'',left:'あと16日',status:'結果待ち',fulfill:'店舗受取',apply:'Web応募',member:'会員条件確認',links:['詳細','応募フォーム']}
];let active='all';
function card(x,i){const p=x.cats[0],mc=x.cats.length>1?' multi'+x.cats.length:'',vars=x.cats.map((c,n)=>`--m${n+1}:${C[c]};`).join('');return `<article class="card ${p}${mc}" style="${vars}" data-cats="${x.cats.join(',')}" data-text="${(x.store+' '+x.title).toLowerCase()}"><button class="summarybtn" data-open="${i}"><div class="main"><div class="meta"><span class="brands">${x.cats.map(c=>`<span class="brand ${c}">${N[c]}</span>`).join('')}</span>${x.status==='未応募'?'<span class="pending">未</span>':''}<span class="store">${x.store}</span></div><div class="title">${x.title}</div></div><div class="datebox ${x.urgent?'urgent':''}"><small>締切</small><div class="date">${x.date}</div>${x.time?`<b style="font-size:10px">${x.time}</b>`:''}<div class="left">${x.left}</div></div></button><div class="detail"><div class="chips"><span class="chip">${x.fulfill}</span><span class="chip app">${x.apply}</span><span class="chip">${x.member}</span></div><div class="links">${x.links.map((l,n)=>`<a ${/応募フォーム/.test(l)?'class="entry"':''} href="#" onclick="return false">${l}</a>`).join('')}</div><div class="statusbox"><label>あなたのステータス</label><select class="select"><option ${x.status==='未応募'?'selected':''}>未応募</option><option ${x.status==='結果待ち'?'selected':''}>結果待ち</option><option>当選</option><option>購入済み</option><option>受取済み</option></select></div></div></article>`}
function render(){const q=document.querySelector('#search').value.toLowerCase();list.innerHTML=data.map(card).join('');document.querySelectorAll('.card').forEach(c=>{const ok=active==='all'||c.dataset.cats.split(',').includes(active),qq=!q||c.dataset.text.includes(q);c.style.display=ok&&qq?'':'none'});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>b.closest('.card').classList.toggle('open'))}search.oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});memberTab.onclick=()=>{memberTab.classList.add('active');adminTab.classList.remove('active');memberView.classList.remove('hide');adminView.classList.remove('show')};adminTab.onclick=()=>{adminTab.classList.add('active');memberTab.classList.remove('active');memberView.classList.add('hide');adminView.classList.add('show')};render();
</script></body></html>
