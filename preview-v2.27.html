<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOM 抽選マネージャー V2.27</title>
<style>html,body{margin:0;min-height:100%;background:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.loading{padding:24px;color:#4b5563;font-weight:700}</style>
</head>
<body>
<div id="loading" class="loading">TOM 抽選マネージャー V2.27 を読み込んでいます...</div>
<script>
(async()=>{
  try{
    const prodConfig={
      url:'https://ofrkhysehruszttnqltt.supabase.co',
      key:'sb_publishable_SWsZkU8JSTP19E6tXBxpCg_6KiPgv4o'
    };
    localStorage.setItem('tom_lottery_supabase_config_v2',JSON.stringify(prodConfig));

    const base='./assets/v2.24/app.gz.b64.part';
    const parts=await Promise.all([1,2,3,4].map(n=>fetch(base+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('asset '+n);return r.text()})));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    if(typeof DecompressionStream==='undefined')throw new Error('DecompressionStream unsupported');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    const patch=[
      '<script src="./loss-review-v2.25.js?v=2.27.0"><'+'/script>',
      '<script src="./mail-ui-cleanup-v2.25.js?v=2.27.0"><'+'/script>',
      '<script src="./progress-polish-v2.26.js?v=2.27.0"><'+'/script>',
      '<script src="./mail-settings-v2.27.js?v=2.27.1"><'+'/script>'
    ].join('');
    const patched=html.includes('</body>')?html.replace('</body>',patch+'</body>'):html+patch;
    document.open();
    document.write(patched);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='V2.27の読み込みに失敗しました。<br>ブラウザを更新するか、Chrome / Edge / Safari の最新版で開いてください。';
  }
})();
</script>
</body>
</html>
