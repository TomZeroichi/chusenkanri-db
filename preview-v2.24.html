<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOM 抽選マネージャー V2.24</title>
<style>html,body{margin:0;min-height:100%;background:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.loading{padding:24px;color:#4b5563;font-weight:700}</style>
</head>
<body>
<div id="loading" class="loading">TOM 抽選マネージャー V2.24 を読み込んでいます...</div>
<script>
(async()=>{
  try{
    const base='./assets/v2.24/app.gz.b64.part';
    const parts=await Promise.all([1,2,3,4].map(n=>fetch(base+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('asset '+n);return r.text()})));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    if(typeof DecompressionStream==='undefined')throw new Error('DecompressionStream unsupported');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='V2.24の読み込みに失敗しました。<br>ブラウザを更新するか、Chrome / Edge / Safari の最新版で開いてください。';
  }
})();
</script>
</body>
</html>
