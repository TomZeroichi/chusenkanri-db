<!doctype html>
<html lang="ja">
<head>

<title>TOM 抽選マネージャー V2.24</title>
<style>html,body{margin:0;min-height:100%;background:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.loading{padding:24px;color:#4b5563;font-weight:700}</style>
</head>
<body>
<div id="loading" class="loading">TOM 抽選マネージャー V2.24 を読み込んでいます...</div>
<script>
(async()=>{
  try{
    // GitHub Pages本番用Supabase。公開用Publishable keyのみを使用し、service_roleは置かない。
    const prodConfig={
      url:'https://ofrkhysehruszttnqltt.supabase.co',
      key:'sb_publishable_SWsZkU8JSTP19E6tXBxpCg_6KiPgv4o'
    };
    localStorage.setItem('tom_lottery_supabase_config_v2',JSON.stringify(prodConfig));

    const base='./assets/v2.24/app.gz.b64.part';
    const parts=await Promise.all([1,2,3,4].map(n=>fetch(base+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('asset '+n);return r.text()})));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    if(typeof DecompressionStream==='undefined')throw new Error('DecompressionStream unsupported');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();

    // V2.24 UI hotfix: 自動メール処理の補助バッジはカード一覧では非表示にする。
    // 内部のメール連携・進捗更新データはそのまま保持する。
    const favicon='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiNmN2ZhZmYiLz48cGF0aCBkPSJNMTIgMTVoNDBhNCA0IDAgMCAxIDQgNHYxMGE1IDUgMCAwIDAgMCAxMHY2YTQgNCAwIDAgMS00IDRIMTJhNCA0IDAgMCAxLTQtNHYtNmE1IDUgMCAwIDAgMC0xMFYxOWE0IDQgMCAwIDEgNC00WiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTc2ZmU1IiBzdHJva2Utd2lkdGg9IjUiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48cGF0aCBkPSJNMTkgMzJoMjR2MTVIMTl6IiBmaWxsPSIjZmZmIiBzdHJva2U9IiMxNzZmZTUiIHN0cm9rZS13aWR0aD0iNCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjxwYXRoIGQ9Im0yMCAzNCAxMSA4IDExLTgiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE3NmU1IiBzdHJva2Utd2lkdGg9IjQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjxjaXJjbGUgY3g9IjQ2IiBjeT0iNDYiIHI9IjExIiBmaWxsPSIjZWY0ZDVhIi8+PHBhdGggZD0ibTQxIDQ2IDMgMyA3LTgiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSI0IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4=';
    const hotfix=`
      <link rel="icon" type="image/svg+xml" href="${favicon}">
      <link rel="apple-touch-icon" href="${favicon}">
      <script id="v224-mail-badge-hotfix">
      (()=>{
        const targets=['メール自動更新','購入完了メール確認済み'];
        const clean=s=>String(s||'').replace(/[\\s✉📩✓✔✅／/]+/g,'');
        const shouldHide=t=>targets.some(x=>clean(t).includes(clean(x)));
        const hide=()=>{
          const candidates=document.querySelectorAll('.small-chip,.badge,.mail-badge,.status-badge,[class*="chip"],[class*="badge"],span,div');
          candidates.forEach(el=>{
            if(el.dataset.tomMailBadgeHidden==='1')return;
            const text=(el.textContent||'').trim();
            if(!text||text.length>40)return;
            if(shouldHide(text)){
              el.style.setProperty('display','none','important');
              el.dataset.tomMailBadgeHidden='1';
            }
          });
        };
        const start=()=>{
          hide();
          const obs=new MutationObserver(()=>hide());
          obs.observe(document.body||document.documentElement,{childList:true,subtree:true,characterData:true});
        };
        if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
      })();
      <\/script>`;
    const patchedHtml=html.includes('</head>')?html.replace('</head>',hotfix+'</head>'):hotfix+html;

    document.open();
    document.write(patchedHtml);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='V2.24の読み込みに失敗しました。<br>ブラウザを更新するか、Chrome / Edge / Safari の最新版で開いてください。';
  }
})();
</script>
</body>
</html>
