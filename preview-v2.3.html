<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOM 抽選マネージャー V2.3 Preview</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#202633;--muted:#7c8595;--line:#dce2eb;--blue:#3d83ef;--pokemon:#ffe600;--pokemon-soft:#fffec7;--onepiece:#d91f4e;--onepiece-soft:#ffe3ec;--dragonball:#ff9f1a;--dragonball-soft:#fff1bf;--other:#25a7ff;--other-soft:#e2f5ff;--danger:#ed4350}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:820px;margin:auto;padding:14px 12px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:20px;margin:0}.top small{color:var(--muted)}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}.tabs button,.filter,.sort,.soft,.primary{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:800}.tabs button.active,.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.sum{border:1px solid var(--line);border-radius:14px;padding:11px 10px;background:#fff}.sum:nth-child(1){background:#eef6ff}.sum:nth-child(2){background:#fffec7}.sum:nth-child(3){background:#ffe8ef}.sum:nth-child(4){background:#fff1bf}.sum span{font-size:11px;color:var(--muted);font-weight:800}.sum b{display:block;font-size:25px;margin-top:3px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px}.row{display:grid;grid-template-columns:1fr 130px;gap:8px}.input,.select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.filter{border-radius:999px;padding:7px 10px;font-size:11px}.filter.active{background:#1f2734;color:#fff}.listhead{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px}.listhead h2{font-size:16px;margin:0}.sort{padding:8px 10px}.list{display:flex;flex-direction:column;gap:9px}.card{position:relative;border:2px solid var(--line);border-left:0;border-radius:16px;overflow:hidden;background:#fff}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--strip)}.card.pokemon{--strip:var(--pokemon);border-color:#f1da00;background:var(--pokemon-soft)}.card.onepiece{--strip:var(--onepiece);border-color:#ef9db2;background:var(--onepiece-soft)}.card.dragonball{--strip:var(--dragonball);border-color:#f6c06d;background:var(--dragonball-soft)}.card.other{--strip:var(--other);border-color:#87cef7;background:var(--other-soft)}.card.multi2:before{background:linear-gradient(to bottom,var(--m1) 0 50%,var(--m2) 50% 100%)}.card.multi3:before{background:linear-gradient(to bottom,var(--m1) 0 33.33%,var(--m2) 33.33% 66.66%,var(--m3) 66.66% 100%)}.summarybtn{width:100%;border:0;background:transparent;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:11px 9px 11px 16px}.main{min-width:0}.meta{display:flex;align-items:center;gap:6px;min-width:0;margin-bottom:6px}.brandstack{display:inline-flex;gap:4px;flex-wrap:wrap}.brand{border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;white-space:nowrap}.brand.pokemon{background:var(--pokemon);color:#332b00}.brand.onepiece{background:var(--onepiece);color:#fff}.brand.dragonball{background:var(--dragonball);color:#fff}.brand.other{background:var(--other);color:#fff}.pending{width:25px;height:25px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-size:12px;font-weight:900}.store{color:var(--muted);font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.datebox{width:92px;border:2px solid rgba(0,0,0,.08);border-radius:13px;padding:6px;text-align:center;background:#fff}.datebox.urgent{background:var(--danger);color:#fff;border-color:var(--danger)}.datebox small{display:block;color:var(--muted);font-weight:900}.datebox.urgent small{color:#fff}.date{font-size:26px;line-height:1;font-weight:1000;margin:3px 0}.left{font-size:10px;font-weight:900;color:var(--danger)}.datebox.urgent .left{color:#fff}.detail{display:none;border-top:1px solid var(--line);padding:12px 12px 12px 16px}.card.open .detail{display:block}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 7px;font-size:10px;font-weight:800}.links{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.links a{text-decoration:none;color:var(--text);border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;text-align:center;font-size:12px;font-weight:900}.links a.entry{background:var(--blue);border-color:var(--blue);color:#fff}.statusbox{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.statusbox label{font-size:11px;font-weight:900;color:var(--muted)}.statusbox select{margin-top:5px}.admin{display:none}.admin.show{display:block}.member.hide{display:none}.adminpanel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.adminpanel h3{margin:0 0 4px;font-size:15px}.adminpanel p{color:var(--muted);font-size:12px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900}.choice.on.pokemon{background:var(--pokemon)}.choice.on.onepiece{background:var(--onepiece);color:#fff}.choice.on.dragonball{background:var(--dragonball);color:#fff}.choice.on.other{background:var(--other);color:#fff}.note{margin-top:10px;padding:10px;border-radius:12px;background:#f6f9ff;color:#49658e;font-size:12px}.demo{margin-top:12px;border:1px dashed #9db6d7;border-radius:13px;padding:10px;font-size:12px;color:#53657e}@media(max-width:560px){.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.links{grid-template-columns:1fr}.datebox{width:84px}.date{font-size:23px}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div><h1>TOM 抽選マネージャー</h1><small>V2.3 共有プレビュー</small></div><span class="badge">DEMO</span></div>
<div class="tabs"><button id="memberTab" class="active">会員画面</button><button id="adminTab">運営画面</button></div>
<section class="member" id="memberView">
<div class="summary"><div class="sum"><span>管理中</span><b>5</b></div><div class="sum"><span>未応募</span><b>4</b></div><div class="sum"><span>本日締切</span><b>1</b></div><div class="sum"><span>3日以内</span><b>2</b></div></div>
<div class="toolbar"><div class="row"><input id="search" class="input" placeholder="店舗・商品を検索"><select id="statusFilter" class="select"><option>すべて</option><option>未応募</option><option>結果待ち</option><option>当選</option></select></div><div class="cats"><button class="filter active" data-cat="all">すべて</button><button class="filter" data-cat="pokemon">POKÉMON</button><button class="filter" data-cat="onepiece">ONE PIECE</button><button class="filter" data-cat="dragonball">DRAGON BALL</button><button class="filter" data-cat="other">OTHER / TOY</button></div></div>
<div class="listhead"><h2>抽選一覧</h2><select class="sort"><option>締切が近い順</option></select></div>
<div class="list" id="list"></div>
</section>
<section class="admin" id="adminView"><div class="adminpanel"><h3>運営画面</h3><p>抽選情報は運営が一括更新し、各会員の進捗は個別保存する設計です。</p><label><b>カテゴリ（複数可）</b></label><div class="choices" id="choices"><button class="choice on pokemon" data-c="pokemon">POKÉMON</button><button class="choice on onepiece" data-c="onepiece">ONE PIECE</button><button class="choice dragonball" data-c="dragonball">DRAGON BALL</button><button class="choice other" data-c="other">OTHER / TOY</button></div><div class="note">複数カテゴリを選択すると、一覧カードには複数ラベルを表示し、左の縁は2色・3色まで分割して表示します。</div><div class="demo">現在の本番化方針：Supabase Auth + RLS。運営共通の抽選DBと、会員本人だけが更新できる個人進捗DBを分離します。</div></div></section>
</main>
<script>
const C={pokemon:'#ffe600',onepiece:'#d91f4e',dragonball:'#ff9f1a',other:'#25a7ff'};
const names={pokemon:'POKÉMON',onepiece:'ONE PIECE',dragonball:'DRAGON BALL',other:'OTHER / TOY'};
const data=[
{cats:['onepiece'],store:'Joshin',title:'ストームエメラルダ / 世界最強の戦士',date:'8/20',time:'17:59',left:'本日',status:'未応募',urgent:true},
{cats:['onepiece'],store:'ヤマシロヤ',title:'決戦の刻 / 神の島の冒険',date:'8/21',time:'21:30',left:'あと1日',status:'結果待ち'},
{cats:['pokemon'],store:'三洋堂',title:'30th CELEBRATION / プレミアムデッキセット',date:'9/1',time:'',left:'あと12日',status:'未応募'},
{cats:['pokemon','onepiece'],store:'複合抽選サンプル',title:'ポケカ + ONE PIECE 同時抽選',date:'9/3',time:'20:00',left:'あと14日',status:'未応募'},
{cats:['pokemon','onepiece','dragonball'],store:'3カテゴリ抽選サンプル',title:'POKÉMON / ONE PIECE / DRAGON BALL',date:'9/5',time:'',left:'あと16日',status:'未応募'}
];
let active='all';
function card(x,i){const p=x.cats[0],multi=x.cats.length>1?' multi'+x.cats.length:'',vars=x.cats.map((c,n)=>`--m${n+1}:${C[c]};`).join('');return `<article class="card ${p}${multi}" style="${vars}" data-cats="${x.cats.join(',')}" data-text="${(x.store+' '+x.title).toLowerCase()}"><button class="summarybtn" data-open="${i}"><div class="main"><div class="meta"><span class="brandstack">${x.cats.map(c=>`<span class="brand ${c}">${names[c]}</span>`).join('')}</span>${x.status==='未応募'?'<span class="pending">未</span>':''}<span class="store">${x.store}</span></div><div class="title">${x.title}</div></div><div class="datebox ${x.urgent?'urgent':''}"><small>締切</small><div class="date">${x.date}</div>${x.time?`<b style="font-size:10px">${x.time}</b>`:''}<div class="left">${x.left}</div></div></button><div class="detail"><div class="chips"><span class="chip">${x.status}</span><span class="chip">店舗受取 / 配送</span><span class="chip">会員登録確認</span></div><div class="links"><a href="#">会員登録</a><a class="entry" href="#">応募フォーム</a></div><div class="statusbox"><label>あなたのステータス</label><select class="select"><option ${x.status==='未応募'?'selected':''}>未応募</option><option ${x.status==='結果待ち'?'selected':''}>結果待ち</option><option>当選</option><option>購入済み</option><option>受取済み</option></select></div></div></article>`}
function render(){const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#list').innerHTML=data.map(card).join('');document.querySelectorAll('.card').forEach(c=>{const okCat=active==='all'||c.dataset.cats.split(',').includes(active),okQ=!q||c.dataset.text.includes(q);c.style.display=okCat&&okQ?'':'none'});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>b.closest('.card').classList.toggle('open'))}
document.querySelector('#search').oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#memberTab').onclick=()=>{memberTab.classList.add('active');adminTab.classList.remove('active');memberView.classList.remove('hide');adminView.classList.remove('show')};document.querySelector('#adminTab').onclick=()=>{adminTab.classList.add('active');memberTab.classList.remove('active');memberView.classList.add('hide');adminView.classList.add('show')};document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>b.classList.toggle('on'));render();
</script>
</body>
</html>
